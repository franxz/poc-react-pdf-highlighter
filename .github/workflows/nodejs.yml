name: Node CI
on:
  push:
    branches: [ poc-app-state ]
  pull_request:
    branches: [ poc-app-state ]
  workflow_dispatch:
jobs:
  build:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Run build
      run: npm run build
    - name: Deploy
      if: ${{ github.ref == 'refs/heads/poc-app-state' }}
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./example/dist
